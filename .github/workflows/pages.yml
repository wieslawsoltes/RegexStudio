name: Build and deploy RegexStudio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.403"
      - name: Install browser workload
        run: dotnet workload install wasm-tools
      - name: Test JavaScript modules
        run: npm test
      - name: Test .NET engine
        run: dotnet run --project engine/RegexStudio.Engine.Tests -c Release
      - name: Build application
        run: npm run build
      - name: Verify trimmed WebAssembly engine
        run: node engine/wasm-smoke.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
